services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: swayam2 }
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  meilisearch:
    image: getmeili/meilisearch:v1.9
    environment: { MEILI_MASTER_KEY: dev-master-key }
    ports: ["7700:7700"]
  api:
    build: { context: .., dockerfile: infra/api.Dockerfile }
    env_file: ../.env.example
    ports: ["4000:4000"]
    depends_on: [postgres, redis, meilisearch]
  web:
    build: { context: .., dockerfile: infra/web.Dockerfile }
    env_file: ../.env.example
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { postgres-data: {} }
